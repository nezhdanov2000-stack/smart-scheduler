# System architecture: secure self-hosted Docker environment
#   n8n Orchestrator (main + worker, queue mode)  |  Redis / BullMQ  |  PostgreSQL
# Credentials (Telegram, OpenAI, Google OAuth) are NOT stored here: they live in
# n8n's encrypted credential vault, encrypted with N8N_ENCRYPTION_KEY.

x-n8n-env: &n8n-env
  # --- database (execution logs, credential references) ---
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  # --- queue mode: Redis-backed BullMQ queue decouples ingestion from execution ---
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  # --- encrypted credential vault ---
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  # --- URLs ---
  # The editor (and therefore the Google OAuth redirect URI) stays on localhost, which Google
  # accepts over plain http:   http://localhost:5678/rest/oauth2-credential/callback
  # Telegram needs public HTTPS, so webhooks go through the tunnel URL (written by start.ps1).
  N8N_EDITOR_BASE_URL: http://localhost:5678
  WEBHOOK_URL: ${WEBHOOK_URL}
  N8N_PROXY_HOPS: 1
  # --- misc ---
  GENERIC_TIMEZONE: ${TIMEZONE}
  TZ: ${TIMEZONE}
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: 336   # hours (14 days) - data minimisation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-audit.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "127.0.0.1:5678:5678"   # editor on localhost only; webhooks arrive through the tunnel
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    command: worker --concurrency=${WORKER_CONCURRENCY:-5}
    environment: *n8n-env
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n
    networks: [internal]

  # Public HTTPS entry point for the Telegram webhook. A Cloudflare "quick tunnel" needs no
  # account; its URL changes on every start, which start.ps1 / start.sh handle. For a fixed
  # URL use a named Cloudflare tunnel or ngrok and set WEBHOOK_URL in .env yourself.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://n8n:5678
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  internal:
